<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Blog</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!--Navigation-->
    <header>
    <h2>My Blog</h2>
    <nav>
        <a href="index.html">Home</a>
        <a href="add-blog.html">Add Blog</a>
    </nav>
    <hr>
    </header>

    <!--Form-->
    <main>
        <h1>Add Blog</h1>
        <form>
            <table cellpadding="12" align="center">
                <tr>
                    <td><lable>Blog Title </lable></td>
                    <td>
                        <input type="text" placeholder="Enter blog Title">
                    </td>
                </tr>
                <tr>
                    <td><lable>Author</lable></td>
                    <td>
                        <input type="text" placeholder="Enter Author Name">
                    </td>
                </tr>
                <tr>
                    <td><lable>Category</lable></td>
                    <td>
                        <select>
                            <option value="Technology">Technology</option>
                            <option value="Education">Education</option>
                            <option value="Programming">Programming</option>
                            <option value="Travel">Travel</option>
                            <option value="Sports">Sports</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td><lable>Published date</lable></td>
                    <td>
                        <input type="date">
                    </td>
                </tr>
                <tr>
                    <td><lable>Blog Content</lable></td>
                    <td>
                        <textarea rows="6" cols="40" placeholder="write your blog here"></textarea>
                    </td>
                </tr>
                <tr>
                    <td><button>Submit</button></td>
                    <td><button>Clear</button></td>
                </tr>
            </table>
        </form>
    </main>
    <!--Footer-->
            <footer>
                <p>&copy; 2026 My Blog. All Rights Reserved</p>
            </footer>

</body>
</html>
