<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Blog</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!--Navigation-->
    <header>
        <h2>My Blog</h2>
        <nav>
            <a href="index.html">Home</a>
            <a href="add-blog.html">Add Blog</a>
        </nav>
        <hr>
    </header>

    <!--Form-->
    <main>
        <h1>Add Blog</h1>
        <form action="/add-blog" method="POST" id="blogForm">
            <table cellpadding="12" align="center">
                <tr>
                    <td><label>Blog Title </label></td>
                    <td>
                        <input type="text" id="title" name="title" placeholder="Enter blog Title">
                    </td>
                </tr>
                <tr>
                    <td><label>Author</label></td>
                    <td>
                        <input type="text" id="author" name="author" placeholder="Enter Author Name">
                    </td>
                </tr>
                <tr>
                    <td><label>Category</label></td>
                    <td>
                        <select id="category" name="category">
                            <option value="">Select Category</option>
                            <option value="Technology">Technology</option>
                            <option value="Education">Education</option>
                            <option value="Programming">Programming</option>
                            <option value="Travel">Travel</option>
                            <option value="Sports">Sports</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td><label>Published date</label></td>
                    <td>
                        <input type="date" id="date" name="date">
                    </td>
                </tr>
                <tr>
                    <td><label>Blog Content</label></td>
                    <td>
                        <textarea rows="6" cols="40" id="content" name="content" placeholder="write your blog here"></textarea>
                    </td>
                </tr>
                <tr>
                    <td colspan="2">
                        <div class="button-group">
                            <button type="submit">Submit</button>
                            <button type="reset">Clear</button>
                        </div>
                    </td>
                </tr>
            </table>
        </form>
    </main>
    <!--Footer-->
    <footer>
        <p>&copy; 2026 My Blog. All Rights Reserved</p>
    </footer>
    <script src="js/script.js"></script>
</body>

</html>
